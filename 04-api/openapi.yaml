              tipPercent: 5
      responses:
        '201':
          description: Attempt created, or the open online checkout returned again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
              example:
                id: PA-76001
                orderId: ord_01J8MH0142
                channel: ONLINE
                status: PENDING
                amountCents: 3623
                tipCents: 173
                checkoutUrl: https://checkout.psp.example/c/PA-76001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
