# Brasa API contract (OpenAPI 3.1). Fictional case study; synthetic data only.
openapi: 3.1.0
info:
  title: Brasa API
  version: 1.4.0
  summary: One API for the Brasa customer apps, the iPad till and the Admin Panel (fictional case study).
  description: Contract-first REST API for Brasa, the fictional pickup-ordering and till platform of Brasa Grill (fictional). All data is synthetic.
    Money is integer euro cents including VAT. Times are the branch's local time unless a full date-time is given. Errors use RFC 9457 problem
    details with the codes in api-guidelines.md. Every operation carries x-requirements (SRS IDs) and x-roles. Live updates are Socket.IO events,
    described in realtime-events.md.
  contact:
    name: Business Analyst, Brasa delivery team
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
servers:
- url: https://api.brasa.example/v1
  description: Production (fictional)
- url: https://staging-api.brasa.example/v1
  description: Staging (fictional)
security:
- bearerAuth: []
tags:
- name: Auth
- name: Account
- name: Administration
- name: Branches
- name: Reports
- name: Menu
- name: Cart
- name: Orders
- name: Payments
paths:
  /auth/customer/codes:
    post:
      operationId: requestCustomerCode
      summary: Send a one-time sign-in code to an email address
      tags:
      - Auth
      description: Sends a 6-digit code valid for 10 minutes (BR-002). A new request invalidates the previous code. Returns 403 ACCOUNT_SUSPENDED
        for a suspended customer and 429 OTP_RATE_LIMITED after 5 codes in a rolling hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
            example:
              email: clara.mendes@example.com
              language: en
      responses:
        '202':
          description: Accepted. Returned for every syntactically valid address, including staff addresses, so the response does not reveal accounts
            (BR-001).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRequestAccepted'
              example:
                resendAvailableAt: '2026-09-18T10:01:00Z'
                codeLength: 6
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-requirements:
      - FR-IAM-01
      - FR-IAM-02
      x-roles:
      - GST
      - CUS
  /auth/customer/sessions:
    post:
      operationId: createCustomerSession
      summary: Verify a one-time code and start a customer session
      tags:
      - Auth
      description: 'Errors: 422 OTP_INVALID (with triesLeft), OTP_EXPIRED, OTP_LOCKED after 5 wrong entries.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeVerification'
            example:
              email: clara.mendes@example.com
              code: '418203'
              deviceId: dev-7f2c
      responses:
        '201':
          description: Signed in. The account is created on the first successful verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-requirements:
      - FR-IAM-01
      - FR-IAM-02
      x-roles:
      - GST
      - CUS
  /auth/staff/sessions:
    post:
      operationId: createStaffSession
      summary: Sign in a staff member to the Admin Panel or the till
      tags:
      - Auth
      description: Administrators must send a TOTP code (MFA_REQUIRED otherwise). The till sends client=TILL; Administrator accounts get 403 ROLE_NOT_ALLOWED_ON_TILL
        (BR-004). Five consecutive failures lock the account for 15 minutes (ACCOUNT_LOCKED, BR-006).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSignIn'
            example:
              email: amir.haddad@brasa.example
              password: '********'
              client: TILL
              deviceId: till-mh-1
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-requirements:
      - FR-IAM-04
      - FR-IAM-05
      x-roles:
      - ADM
      - MGR
      - CST
  /auth/staff/password-resets:
    post:
      operationId: requestStaffPasswordReset
      summary: Email a single-use password reset link to a staff member
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: marta.kowalska@brasa.example
      responses:
        '202':
          description: Accepted. Same response whether or not the email exists.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
      x-requirements:
      - FR-IAM-10
      x-roles:
      - ADM
      - MGR
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Sign out on this device
      tags:
      - Auth
      responses:
        '204':
          description: Signed out. Only this device's refresh token and push token are removed (BR-043).
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-requirements:
      - FR-IAM-09
      - FR-NTF-01
      x-roles:
      - CUS
      - ADM
      - MGR
      - CST
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in customer's profile and status
      tags:
      - Account
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: CUS-1001
                type: CUSTOMER
                email: clara.mendes@example.com
                name: Clara
                status: ACTIVE
                prepayOnlyUntil: null
                language: en
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-requirements:
      - FR-IAM-09
      x-roles:
      - CUS
    patch:
      operationId: updateMe
      summary: Update name, phone or language
      tags:
      - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              name: Clara M.
              language: en
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-IAM-09
      x-roles:
      - CUS
    delete:
      operationId: deleteMe
      summary: Delete the customer account
      tags:
      - Account
      description: 409 OPEN_ORDERS_EXIST while the customer has an order that is not collected or canceled.
      responses:
        '202':
          description: Deletion accepted. Personal data is erased or anonymized within 30 days (BR-008).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
      x-requirements:
      - FR-IAM-09
      x-roles:
      - CUS
  /me/devices/{deviceId}:
    put:
      operationId: registerDevice
      summary: Register or refresh this device's push token
      tags:
      - Account
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
            example:
              platform: IOS
              pushToken: fcm-token-redacted
      responses:
        '204':
          description: Stored per device (BR-043).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-NTF-01
      x-roles:
      - CUS
  /accounts:
    get:
      operationId: listAccounts
      summary: Search customer or employee accounts
      tags:
      - Administration
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - CUSTOMER
          - EMPLOYEE
      - name: q
        in: query
        schema:
          type: string
        description: Name, email or phone fragment
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirements:
      - FR-IAM-07
      - FR-IAM-08
      x-roles:
      - ADM
    post:
      operationId: createEmployeeAccount
      summary: Create an employee account
      tags:
      - Administration
      description: 409 EMAIL_IN_USE (BR-001) or COLOR_IN_USE (BR-007).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
            example:
              name: Jonas Berg
              email: jonas.berg@brasa.example
              role: COUNTER_STAFF
              branchIds:
              - LOC-01
              boardColor: PURPLE
              initials: JB
              temporaryPassword: '********'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-IAM-07
      x-roles:
      - ADM
  /accounts/{accountId}:
    patch:
      operationId: updateAccount
      summary: Change an account's details or status
      tags:
      - Administration
      description: Suspend, reinstate, deactivate, reset an employee password or clear Prepay-only, always with a reason. Sending role returns
        422 ROLE_IMMUTABLE (BR-003). Deactivation ends sessions within 60 seconds (BR-005).
      parameters:
      - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
            example:
              status: SUSPENDED
              reason: Abusive messages to staff
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-IAM-06
      - FR-IAM-07
      - FR-IAM-08
      x-roles:
      - ADM
  /branches:
    get:
      operationId: listBranches
      summary: List active branches in display order
      tags:
      - Branches
      responses:
        '200':
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - bearerAuth: []
      x-requirements:
      - FR-ORD-01
      - FR-IAM-03
      x-roles:
      - GST
      - CUS
      - CST
      - MGR
      - ADM
    post:
      operationId: createBranch
      summary: Create a branch
      tags:
      - Branches
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-BRN-01
      x-roles:
      - ADM
  /branches/{branchId}:
    patch:
      operationId: updateBranch
      summary: Change a branch's details, hours, closures, timings or throttle
      tags:
      - Branches
      description: Managers can change hours, closure dates, lead time and cancellation cutoff of assigned branches only; kitchen factors, the
        online limit and the throttle are Administrator-only (403). Deactivation returns 409 BRANCH_HAS_OPEN_ORDERS while orders are open today.
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
            example:
              settings:
                leadTimeMin: 20
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-BRN-01
      - FR-BRN-02
      - FR-BRN-03
      - FR-BRN-04
      - FR-BRN-12
      x-roles:
      - ADM
      - MGR
  /branches/{branchId}/pos-connection:
    post:
      operationId: connectBranchPos
      summary: Start or renew the branch's POS connection
      tags:
      - Branches
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Authorization URL to open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosConnectionStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirements:
      - FR-BRN-05
      x-roles:
      - ADM
  /branches/{branchId}/busy-window:
    put:
      operationId: setBusyWindow
      summary: Set, replace or remove today's busy window
      tags:
      - Branches
      description: One window per branch per day (BR-015). Send start and end as null to remove it. Kitchen minutes from start (inclusive) to
        end (exclusive) are blocked for new orders.
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusyWindowInput'
            example:
              start: '15:00'
              end: '15:30'
              reason: EQUIPMENT
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusyWindow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-BRN-09
      x-roles:
      - MGR
      - ADM
  /branches/{branchId}/delay-block:
    delete:
      operationId: releaseDelayBlock
      summary: Release the current kitchen delay block early
      tags:
      - Branches
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '204':
          description: Released for the orders late at this moment; audited (BR-016).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FR-BRN-10
      x-roles:
      - MGR
      - ADM
  /branches/{branchId}/pickup-slots:
    get:
      operationId: listPickupSlots
      summary: List today's pickup minutes for a cart
      tags:
      - Branches
      description: 'Implements business rules table 3.1. The example is WE-2. The channel comes from the token: the till gets no lead time and
        may receive overbooked minutes (BR-019).'
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: cartId
        in: query
        schema:
          type: string
        description: Customer cart; the till sends kitchenUnits instead
      - name: kitchenUnits
        in: query
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Pickup minutes with availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupSlots'
              example:
                branchId: LOC-01
                date: '2026-09-18'
                serverTime: '2026-09-18T12:04:20+02:00'
                kitchenUnits: 3
                kitchenMinutes: 2
                earliest: '12:15'
                emptyReason: null
                minutes:
                - time: '12:25'
                  available: false
                  reason: KITCHEN_FULL
                - time: '12:28'
                  available: true
                - time: '12:31'
                  available: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FR-BRN-06
      - FR-BRN-07
      - FR-BRN-11
      - FR-BRN-12
      - FR-ORD-06
      - FR-TIL-03
      x-roles:
      - CUS
      - CST
      - MGR
  /branches/{branchId}/snapshot:
    get:
      operationId: getBranchSnapshot
      summary: Get the full live state of a branch for boards and tills
      tags:
      - Branches
      description: Clients load it on every connect, reconnect or sequence gap and apply only events with a higher sequence (BR-045). The view
        parameter removes contact data from the kitchen view (NFR-PRIV-01).
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - name: view
        in: query
        schema:
          type: string
          enum:
          - KITCHEN
          - COUNTER
          - TILL
      responses:
        '200':
          description: Snapshot with the branch sequence number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-requirements:
      - FR-TIL-05
      - FR-TIL-07
      - FR-TIL-08
      - FR-TIL-09
      - FR-TIL-11
      x-roles:
      - CST
      - MGR
      - ADM
  /reports/{reportType}:
    get:
      operationId: getReport
      summary: Get the daily operations summary or the reconciliation report
      tags:
      - Reports
      description: daily-summary is available to Managers for assigned branches; reconciliation to Administrators only.
      parameters:
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum:
          - daily-summary
          - reconciliation
      - name: branchId
        in: query
        schema:
          type: string
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Report rows; text/csv when requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - FR-TIL-13
      - FR-PAY-10
      x-roles:
      - ADM
      - MGR
  /branches/{branchId}/menu:
    get:
      operationId: getMenu
      summary: Get a branch's menu with prices, allergens and availability
      tags:
      - Menu
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - {}
      - bearerAuth: []
      x-requirements:
      - FR-ORD-02
      - FR-MNU-07
      - FR-IAM-03
      x-roles:
      - GST
      - CUS
      - CST
      - MGR
      - ADM
  /branches/{branchId}/categories:
    put:
      operationId: replaceCategories
      summary: Replace the branch's categories and their order
      tags:
      - Menu
      parameters:
      - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-MNU-01
      x-roles:
      - ADM
  /branches/{branchId}/products:
    post:
      operationId: createProduct
      summary: Create a product at a branch
      tags:
      - Menu
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created; the POS article is created asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-MNU-02
      - FR-MNU-05
      - FR-MNU-06
      x-roles:
      - ADM
  /products/{productId}:
    patch:
      operationId: updateProduct
      summary: Change a product
      tags:
      - Menu
      description: 422 ALLERGENS_NOT_CONFIRMED when activating a product whose allergens were never confirmed.
      parameters:
      - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-requirements:
      - FR-MNU-02
      - FR-MNU-06
      - FR-MNU-07
      x-roles:
      - ADM
  /products/{productId}/availability:
    put:
      operationId: setProductAvailability
      summary: Mark a product sold out today or available
      tags:
      - Menu
      parameters:
      - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Availability'
            example:
              soldOutToday: true
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
