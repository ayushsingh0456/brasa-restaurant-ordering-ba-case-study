      - MGR
  /payment-attempts/{attemptId}/verification:
    post:
      operationId: verifyPaymentAttempt
      summary: Ask the provider for the result of an attempt
      tags:
      - Payments
      description: Used after a timeout; never starts a new charge (BR-035). A Manager can send expireIfUnpaid to cancel an open online checkout
        before taking payment at the counter.
      parameters:
