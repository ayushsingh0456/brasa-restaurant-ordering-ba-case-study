              providerTransactionId: tx_55e1
              amountCents: 3623
              cardLast4: '4421'
              occurredAt: '2026-09-18T10:06:10Z'
      responses:
        '200':
          description: Processed, or already processed for this event ID
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
