  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/validation-failed
            title: The request is not valid.
            status: 400
            code: VALIDATION_FAILED
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/auth-failed
            title: Sign in again.
            status: 401
            code: AUTH_FAILED
    Forbidden:
      description: Not allowed for this role or branch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/branch-not-assigned
            title: You do not work at this branch.
            status: 403
            code: BRANCH_NOT_ASSIGNED
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/not-found
            title: Not found.
            status: 404
            code: NOT_FOUND
    Conflict:
      description: The state changed or a rule blocks the action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/slot-taken
            title: 12:31 was just taken. Choose another time.
            status: 409
            code: SLOT_TAKEN
    Unprocessable:
      description: A business rule rejected the input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/validation-failed
            title: Some fields need attention.
            status: 422
            code: VALIDATION_FAILED
    TooManyRequests:
      description: Rate limit reached
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.brasa.example/problems/otp-rate-limited
            title: Try again later.
            status: 429
            code: OTP_RATE_LIMITED
  parameters:
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        example: LOC-01
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: A replay with the same key returns the original response (24 h).
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
