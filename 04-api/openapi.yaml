                totals:
                  grossCents: 3450
                  vatCents: 335
                  netCents: 3115
                  vatByRate:
                  - ratePermille: 100
                    grossCents: 3160
                    vatCents: 287
                    netCents: 2873
                  - ratePermille: 200
