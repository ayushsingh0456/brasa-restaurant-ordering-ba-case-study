    post:
      operationId: startPaymentAttempt
      summary: Start a payment attempt (online checkout or counter)
      tags:
      - Payments
      description: Implements business rules table 3.6. 409 PAYMENT_ALREADY_SUCCEEDED or PAYMENT_ATTEMPT_PENDING; 422 TIP_OUT_OF_RANGE. The attempt
        ID is the merchant reference and idempotency key at the provider (ADR-003).
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
