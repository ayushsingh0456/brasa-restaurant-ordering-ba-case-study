components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with a stable code (see api-guidelines.md).
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: SLOT_TAKEN
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    Money:
      type: integer
      description: Euro cents, VAT included unless named net
      minimum: 0
    CodeRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        language:
          type: string
          pattern: ^[a-z]{2}$
          description: 'ISO 639-1 code: the national language (default) or en'
    CodeRequestAccepted:
      type: object
      properties:
        resendAvailableAt:
          type: string
          format: date-time
        codeLength:
          type: integer
          const: 6
    CodeVerification:
      type: object
      required:
      - email
      - code
      - deviceId
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
        deviceId:
          type: string
    StaffSignIn:
      type: object
      required:
      - email
      - password
      - client
      - deviceId
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        totp:
          type: string
          pattern: ^[0-9]{6}$
        client:
          type: string
          enum:
          - ADMIN_PANEL
          - TILL
        deviceId:
          type: string
    PasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    Session:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          example: 900
        refreshToken:
          type: string
        account:
          $ref: '#/components/schemas/Account'
    Account:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - CUSTOMER
          - EMPLOYEE
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
          description: E.164
        role:
          type:
          - string
          - 'null'
          enum:
          - ADMINISTRATOR
          - MANAGER
          - COUNTER_STAFF
          - null
        branchIds:
          type: array
          items:
            type: string
        boardColor:
          type:
          - string
          - 'null'
        initials:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DEACTIVATED
          - PENDING_DELETION
        prepayOnlyUntil:
          type:
          - string
          - 'null'
          format: date-time
        language:
          type: string
    AccountPage:
      type: object
      properties:
        items:
          type: array
          items:
