      summary: Receive a signed payment event from the card payment provider
      tags:
      - Payments
      description: The only way an online attempt becomes Succeeded (BR-038). Signature and timestamp are checked; 401 WEBHOOK_SIGNATURE_INVALID.
      requestBody:
